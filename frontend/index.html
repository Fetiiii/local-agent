<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Agent</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e6e9ef; --muted:#8b93a7; --accent:#6ea8fe; --accent2:#3b82f6;
    --user:#233045; --ok:#3fb950; --warn:#d29922; --err:#f85149;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f7f8fa;--panel:#fff;--panel2:#f0f2f5;--border:#dfe3ea;
      --text:#1a1d24;--muted:#5b6472;--user:#e5efff;}
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
  header{display:flex;gap:12px;align-items:center;padding:10px 16px;
    border-bottom:1px solid var(--border);background:var(--panel)}
  header b{font-size:16px}
  header .dot{width:9px;height:9px;border-radius:50%;background:var(--err)}
  header .dot.on{background:var(--ok)}
  select{background:var(--panel2);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:6px 10px;font-size:13px}
  #log{flex:1;overflow-y:auto;padding:20px;max-width:900px;width:100%;margin:0 auto}
  .msg{margin:14px 0;display:flex;flex-direction:column;gap:6px}
  .bubble{padding:10px 14px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
  .user .bubble{background:var(--user);align-self:flex-end;max-width:80%}
  .assistant .bubble{background:var(--panel);border:1px solid var(--border)}
  .role{font-size:12px;color:var(--muted);padding:0 4px}
  .user .role{align-self:flex-end}
  details{background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:6px 12px;margin:4px 0;font-size:13.5px}
  details summary{cursor:pointer;color:var(--muted);user-select:none}
  details .plan{margin:8px 0 2px}
  .tool{border-left:3px solid var(--accent2)}
  .tool.running summary::after{content:" ⏳"}
  .tool.done summary::after{content:" ✅"}
  pre{background:rgba(127,127,127,.12);padding:10px;border-radius:8px;overflow-x:auto;font-size:12.5px}
  .notice{font-size:13px;padding:6px 10px;border-radius:8px}
  .notice.error{color:var(--err)} .notice.warn{color:var(--warn)} .notice.info{color:var(--muted)}
  .approval{background:var(--panel);border:1px solid var(--warn);border-radius:12px;padding:14px;margin:8px 0}
  .approval .buttons{display:flex;gap:10px;margin-top:10px}
  button{border:0;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer;font-weight:600}
  .approve{background:var(--ok);color:#fff}.reject{background:var(--err);color:#fff}
  img.artifact{max-width:100%;border-radius:8px;border:1px solid var(--border);margin-top:8px}
  .table-wrap{overflow-x:auto;margin-top:8px} table{border-collapse:collapse;font-size:12.5px}
  th,td{border:1px solid var(--border);padding:4px 8px}
  footer{padding:12px 16px;border-top:1px solid var(--border);background:var(--panel);
    display:flex;gap:10px;max-width:900px;width:100%;margin:0 auto}
  #input{flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--border);
    border-radius:10px;padding:10px 14px;font-size:15px;resize:none;font-family:inherit}
  #send{background:var(--accent2);color:#fff}
  #send:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
  <header>
    <span class="dot" id="status"></span>
    <b>🧠 Local Agent</b>
    <select id="model" title="Model"></select>
    <span style="flex:1"></span>
    <span class="notice info" id="provider"></span>
  </header>
  <div id="log"></div>
  <footer>
    <textarea id="input" rows="1" placeholder="Mesaj yaz… (Enter gönder, Shift+Enter yeni satır)"></textarea>
    <button id="send">Gönder</button>
  </footer>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const modelSel = document.getElementById('model');
const statusDot = document.getElementById('status');
const providerEl = document.getElementById('provider');
let ws, curAssistant = null, busy = false;

function el(cls, html){const d=document.createElement('div'); if(cls)d.className=cls; if(html!=null)d.innerHTML=html; return d;}
function scroll(){log.scrollTop = log.scrollHeight;}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function addUser(text){
  const m=el('msg user'); m.appendChild(el('role','Sen'));
  m.appendChild(el('bubble',esc(text))); log.appendChild(m); scroll();
}
function ensureAssistant(){
  if(!curAssistant){
    const m=el('msg assistant'); m.appendChild(el('role','Agent'));
    curAssistant=el('bubble',''); m.appendChild(curAssistant); log.appendChild(m);
  }
  return curAssistant;
}

async function loadModels(){
  try{
    const r=await fetch('/api/models'); const d=await r.json();
    providerEl.textContent = d.provider + (d.error? ' (hata)':'');
    modelSel.innerHTML='';
    (d.models||[]).forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;modelSel.appendChild(o);});
    if(!(d.models||[]).length){const o=document.createElement('option');o.textContent='(model yok)';modelSel.appendChild(o);}
  }catch(e){ providerEl.textContent='model listesi alınamadı'; }
}

function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = ()=>statusDot.classList.add('on');
  ws.onclose = ()=>{statusDot.classList.remove('on'); setTimeout(connect,1500);};
  ws.onmessage = ev => handle(JSON.parse(ev.data));
}

function handle(m){
  switch(m.type){
    case 'step':{
      let h=''; if(m.thought) h+=`💭 ${esc(m.thought)}`;
      if(m.plan&&m.plan.length) h+=`<div class="plan">📋 ${m.plan.map(esc).join('<br>• ').replace(/^/,'• ')}</div>`;
      const d=document.createElement('details'); d.innerHTML=`<summary>Düşünce</summary>${h}`;
      log.appendChild(d); scroll(); break;
    }
    case 'tool_start':{
      const d=document.createElement('details'); d.className='tool running'; d.id='tool-'+m.id;
      d.innerHTML=`<summary>🔧 ${esc(m.name)}</summary><pre>${esc(JSON.stringify(m.args,null,2))}</pre>`;
      log.appendChild(d); scroll(); break;
    }
    case 'tool_end':{
      const d=document.getElementById('tool-'+m.id); if(!d)break;
      d.className='tool done';
      d.innerHTML+=`<pre>${esc(m.result)}</pre>`;
      (m.artifacts||[]).forEach(a=>d.appendChild(renderArtifact(a)));
      scroll(); break;
    }
    case 'token': ensureAssistant().textContent += m.text; scroll(); break;
    case 'final': ensureAssistant().textContent = m.text; scroll(); break;
    case 'notice':{
      log.appendChild(el('notice '+(m.level||'info'), esc(m.text))); scroll(); break;
    }
    case 'approval_request': renderApproval(m); break;
    case 'done': setBusy(false); curAssistant=null; break;
  }
}

function renderArtifact(a){
  if(a.type==='image'){const i=document.createElement('img');i.className='artifact';i.src=a.data;return i;}
  if(a.type==='table'){const w=el('table-wrap',a.html);return w;}
  if(a.type==='links'){return el('', a.items.map(x=>`<div>🔗 <a href="${x.link}" target="_blank">${esc(x.title||x.link)}</a></div>`).join(''));}
  if(a.type==='plotly'){return el('notice info','📊 interaktif grafik (plotly) — görüntüleyici yakında');}
  if(a.type==='text'){return el('',`<pre>${esc(a.text)}</pre>`);}
  return el('notice info','📎 '+esc(a.type));
}

function renderApproval(m){
  const c=el('approval'); c.innerHTML=`<b>${esc(m.title)}</b><div style="margin-top:8px">${m.detail.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>`;
  const b=el('buttons');
  const ok=el(); ok.innerHTML='<button class="approve">✅ Onayla</button>';
  const no=el(); no.innerHTML='<button class="reject">❌ Reddet</button>';
  ok.onclick=()=>{ws.send(JSON.stringify({type:'approval_response',id:m.id,approved:true}));c.remove();};
  no.onclick=()=>{ws.send(JSON.stringify({type:'approval_response',id:m.id,approved:false}));c.remove();};
  b.appendChild(ok);b.appendChild(no);c.appendChild(b);log.appendChild(c);scroll();
}

function setBusy(b){busy=b;sendBtn.disabled=b;}
function send(){
  const text=input.value.trim(); if(!text||busy||ws.readyState!==1)return;
  addUser(text); input.value=''; input.style.height='auto'; setBusy(true); curAssistant=null;
  ws.send(JSON.stringify({type:'user_message',content:text,model:modelSel.value}));
}
sendBtn.onclick=send;
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px';});

loadModels(); connect();
</script>
</body>
</html>
